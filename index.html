<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>A Birthday Surprise For You</title>
    <meta name="description" content="An interactive birthday surprise: open the gift, read the card, relive the memories." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Background layers (gradient glow + particle canvas) -->
    <div class="bg-glow" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div id="floaters" aria-hidden="true"></div>

    <!-- Music toggle -->
    <button id="musicBtn" class="music-btn" type="button" aria-pressed="false">
      <span class="music-icon">🎵</span><span id="musicLabel">Music Off</span>
    </button>

    <main id="stage">
      <!-- ============ SCENE 1 : WELCOME ============ -->
      <section class="scene is-active" data-scene="1">
        <div class="scene-inner">
          <p class="eyebrow">psst… come closer</p>
          <h1 class="display">Hey! I have a little surprise for you ❤️</h1>
          <p class="lede">It only takes a minute. Tap the button below.</p>
          <button class="btn btn-primary" type="button" data-next>Open Your Surprise 🎁</button>
        </div>
      </section>

      <!-- ============ SCENE 2 : GIFT BOX ============ -->
      <section class="scene" data-scene="2">
        <div class="scene-inner">
          <h2 class="title">Your gift is waiting…</h2>
          <p class="lede">Tap the box to open it</p>
          <button id="giftBox" class="gift" type="button" aria-label="Open the gift box">
            <span class="gift-lid"></span>
            <span class="gift-body"></span>
            <span class="gift-ribbon"></span>
            <span class="gift-bow">🎀</span>
          </button>
        </div>
      </section>

      <!-- ============ SCENE 3 : BIRTHDAY REVEAL ============ -->
      <section class="scene" data-scene="3">
        <div class="scene-inner">
          <h2 class="display glow" id="revealHeading"></h2>
          <p class="lede type-line" id="revealSub"></p>
          <button class="btn btn-ghost" type="button" data-next>Continue ✨</button>
        </div>
      </section>

      <!-- ============ SCENE 4 : BIRTHDAY CARD ============ -->
      <section class="scene" data-scene="4">
        <div class="scene-inner">
          <article class="card">
            <div class="card-deco">🎈 🎂 🎉</div>
            <h3 class="script" id="cardTitle"></h3>
            <p class="card-msg" id="cardMessage"></p>
            <div class="card-sign">With all my love ❤️</div>
            <span class="sparkle s1">✦</span><span class="sparkle s2">✧</span
            ><span class="sparkle s3">✦</span>
          </article>
          <button class="btn btn-primary" type="button" data-next>See our memories 📸</button>
        </div>
      </section>

      <!-- ============ SCENE 5 : PHOTO MEMORIES ============ -->
      <section class="scene" data-scene="5">
        <div class="scene-inner wide">
          <h2 class="title">Little moments I keep</h2>
          <div class="gallery" id="gallery"></div>
          <button class="btn btn-primary" type="button" data-next>One last thing ❤️</button>
        </div>
      </section>

      <!-- ============ SCENE 6 : FINAL SURPRISE ============ -->
      <section class="scene" data-scene="6">
        <div class="scene-inner">
          <h2 class="display glow" id="finalText">One Last Thing… ❤️</h2>
          <div class="big-heart" id="bigHeart">❤️</div>
          <p class="lede" id="finalSub">Thank you for existing.</p>
          <button class="btn btn-ghost" type="button" data-restart>Replay the surprise ↺</button>
        </div>
      </section>
    </main>

    <!-- Lightbox for expanded photos -->
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">✕</button>
      <figure>
        <img id="lightboxImg" alt="" />
        <figcaption id="lightboxCap"></figcaption>
      </figure>
    </div>

    <audio id="bgMusic" loop preload="none"></audio>
    <script src="js/script.js"></script>
  </body>
</html>
